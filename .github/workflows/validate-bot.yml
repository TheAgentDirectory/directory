name: Validate Bot PR

on:
  pull_request:
    paths:
      - 'registry/bots/*.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JSON Schema and Limits
        run: |
          for file in registry/bots/*.json; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              
              # Check file size (limit to 10KB)
              size=$(stat -c%s "$file")
              if [ $size -gt 10240 ]; then
                echo "Validation failed: File $file is too large ($size bytes). Max 10KB."
                process.exit 1
              fi

              node -e "
                const fs = require('fs');
                const content = fs.readFileSync('$file', 'utf8');
                try {
                  const data = JSON.parse(content);
                  
                  // Required fields
                  if (!data.id || !data.name || !data.interfaces) {
                    console.error('Validation failed: Missing required fields (id, name, interfaces)');
                    process.exit(1);
                  }

                  // String limits to prevent bloat
                  if (data.name.length > 50) throw new Error('Name too long (max 50)');
                  if (data.description && data.description.length > 300) throw new Error('Description too long (max 300)');
                  
                  // Interfaces validation
                  if (!Array.isArray(data.interfaces) || data.interfaces.length === 0) {
                     throw new Error('Interfaces must be a non-empty array');
                  }
                  
                  console.log('Validation passed!');
                } catch (e) {
                  console.error('Validation Error: ' + e.message);
                  process.exit(1);
                }
              "
            fi
          done
